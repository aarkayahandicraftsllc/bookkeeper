# Builds Bookkeeper.exe on GitHub's machines.
#
# Why this exists: the work computer blocks copying an .exe off it, so the
# 144 MB executable cannot be hand-carried to the personal machine. Pushing a
# tag here produces a downloadable .exe attached to a GitHub Release instead --
# only source ever leaves the work machine, and the personal PC needs neither
# Python nor PyInstaller. Same arrangement as the networth-tracker project.
# See UPDATE-ON-PERSONAL-PC.txt.
#
#   Cut a release:   git tag v1.0.0 && git push origin v1.0.0
#   Or build without releasing: Actions tab -> this workflow -> Run workflow
#
# There is no tag-vs-version check, unlike networth-tracker: this app carries
# no version string of its own, so a tag is only a label for the release page
# and there is nothing it could contradict.
#
# DESKTOP ONLY. requirements-desktop.txt is installed and requirements.txt
# (Streamlit) is not, so test_multi_company.py skips its browser section and
# reports "PASSED, WITH SKIPS" -- that is the expected result here, and
# test_ui.py is not run at all because it exists only to drive that front end.

name: Build Bookkeeper.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows executable (.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-desktop.txt

      - name: Install dependencies
        run: pip install -r requirements-desktop.txt pyinstaller

      # The suites run BEFORE the build, so a release can never carry a build
      # that fails its own checks. Qt runs headless here; there is no display
      # on a CI runner.
      - name: Accounting and report checks
        run: python test_books.py

      - name: Desktop checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python test_desktop.py

      # The unpinned launch path: how the app actually starts, which the other
      # suites deliberately bypass by pinning BOOKS_DB.
      - name: Launch-path checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python test_multi_company.py

      - name: Build the executable
        run: python build_exe.py

      # Named with the tag for the release page, because the build itself
      # always produces a bare "Bookkeeper.exe" and several downloads would
      # otherwise collide in one Downloads folder.
      - name: Name it for this release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: cp Bookkeeper.exe "Bookkeeper-${GITHUB_REF_NAME}.exe"

      # Available on every run, including a manual dispatch with no tag.
      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bookkeeper-exe
          path: Bookkeeper.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Bookkeeper-${{ github.ref_name }}.exe
          body: |
            Bookkeeper desktop app, ${{ github.ref_name }}. Windows, 64-bit.

            **Put it in the folder that already holds `data\`, replacing the
            old `Bookkeeper.exe`.** The books live in a `data\` folder beside
            the executable, so an exe run from anywhere else — Downloads, the
            desktop — creates its own empty `data\` and opens blank books.
            That looks exactly like data loss and is not; the books are still
            in the old folder.

            Windows SmartScreen will warn, because the app is not
            code-signed: choose "More info" then "Run anyway".

            Your books are not touched by replacing the executable. Any new
            database columns are added on first open.
